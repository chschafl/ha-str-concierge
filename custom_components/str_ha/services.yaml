sync_keymaster:
  name: Sync Keymaster Slot
  description: >
    Write the current guest's door code and lock access window to a
    Keymaster code slot. The window is automatically adjusted by the
    checkin/checkout offset configured in the integration options.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the STR HA integration instance.
      required: true
      example: "abc123def456"
      selector:
        text:
    property_id:
      name: Property ID
      description: The property ID to sync (as configured in the integration).
      required: true
      example: "listing_001"
      selector:
        text:
    slot:
      name: Keymaster Slot Name
      description: >
        The code slot name used in Keymaster entity IDs, e.g. "str_guest"
        maps to input_text.keymaster_str_guest_pin.
      required: true
      example: "str_guest"
      selector:
        text:
